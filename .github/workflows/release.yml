name: Build qwenproxy image

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "johngbl/qwenproxy ref (tag or branch); empty = latest release"
        required: false
        default: ""
      force:
        description: "Rebuild even if the tag already exists in GHCR"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-qwenproxy
  cancel-in-progress: false

env:
  UPSTREAM: johngbl/qwenproxy
  IMAGE: qwenproxy

jobs:
  resolve:
    name: Resolve upstream ref
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      exists: ${{ steps.exists.outputs.exists }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Lowercase owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$MANUAL_REF" ]; then
            echo "ref=$MANUAL_REF" >> "$GITHUB_OUTPUT"
            echo "Manual ref: $MANUAL_REF"
            exit 0
          fi
          REF="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          if [ -z "$REF" ]; then
            echo "No releases found in ${UPSTREAM}" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $REF"

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tag in GHCR
        id: exists
        if: ${{ !inputs.force }}
        env:
          IMAGE_REF: ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ env.IMAGE }}:${{ steps.ref.outputs.ref }}
        run: |
          if docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_REF already exists - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: "https://github.com/${{ env.UPSTREAM }}.git#${{ needs.resolve.outputs.ref }}"
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ghcr.io/${{ needs.resolve.outputs.owner_lc }}/${{ env.IMAGE }}:${{ needs.resolve.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.ref }}
            org.opencontainers.image.description=Built from ${{ env.UPSTREAM }} ${{ needs.resolve.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
