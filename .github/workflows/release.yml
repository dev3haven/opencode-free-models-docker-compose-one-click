name: Build qwenproxy image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: qwenproxy-image
  cancel-in-progress: false

jobs:
  build-push:
    name: Build, fingerprint, push on change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to GHCR (docker)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR (skopeo)
        run: skopeo login ghcr.io --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Parse pinned version from compose
        run: |
          set -euo pipefail
          mapfile -t REFS < <(
            grep -rohE "ghcr\.io/[^\"'[:space:]]+:v[0-9][^\"'[:space:]]*" \
              --include="*.yml" --include="*.yaml" \
              --exclude-dir=".git" --exclude-dir=".github" \
              . 2>/dev/null | sort -u
          )
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "no pinned ghcr.io image ref (ghcr.io/...:v...) found in any yml/yaml file" >&2
            exit 1
          fi
          echo "found refs: ${REFS[*]}"
          IMAGE_REF="${REFS[0]}"
          IMAGE="${IMAGE_REF%:*}"
          BASE="${IMAGE_REF##*:}"
          case "$BASE" in
            v[0-9]*) ;;
            *) echo "unexpected pinned tag: $BASE" >&2; exit 1 ;;
          esac
          {
            echo "IMAGE=$IMAGE"
            echo "BASE=$BASE"
          } >> "$GITHUB_ENV"
          echo "pinned by compose: ${IMAGE}:${BASE} (builds upstream ${BASE})"

      - name: Build candidate
        run: |
          set -euo pipefail
          [ -f Dockerfile ] || { echo "Dockerfile not found at repo root" >&2; exit 1; }
          docker build --pull --build-arg "UPSTREAM_REF=${BASE}" --tag qwenproxy:candidate .

      - name: Fingerprint and compare with the deployed image
        run: |
          set -euo pipefail
          fingerprint() {
          docker run --rm -i --entrypoint /bin/sh "$1" <<'FPS'
          dpkg-query -W -f='${binary:Package} ${Version}\n' | sort
          node --version
          npm --version
          find /app /ms-playwright -type f -print0 | sort -z | xargs -0 sha256sum
          FPS
          }
          NEW_FP=$(fingerprint qwenproxy:candidate | sha256sum | cut -d' ' -f1)
          echo "NEW_FP=$NEW_FP" >> "$GITHUB_ENV"
          if docker pull "${IMAGE}:${BASE}" >/dev/null 2>&1; then
            OLD_FP=$(fingerprint "${IMAGE}:${BASE}" | sha256sum | cut -d' ' -f1)
          else
            OLD_FP=""
            echo "no deployed image at ${IMAGE}:${BASE} yet - first build"
          fi
          if [ -n "$OLD_FP" ] && [ "$NEW_FP" = "$OLD_FP" ]; then
            echo "UNCHANGED=true" >> "$GITHUB_ENV"
            echo "fingerprint ${NEW_FP:0:16}... identical to ${IMAGE}:${BASE} - no push, suffix not incremented"
          else
            echo "UNCHANGED=false" >> "$GITHUB_ENV"
            echo "fingerprint changed: ${OLD_FP:0:16}... -> ${NEW_FP:0:16}..."
          fi

      - name: Push with auto-incremented suffix
        if: env.UNCHANGED == 'false'
        run: |
          set -euo pipefail
          BASE_ESC=$(printf '%s' "$BASE" | sed 's/[.]/\\./g')
          LAST=$(skopeo list-tags "docker://${IMAGE}" | jq -r '.Tags[]?' | grep -E "^${BASE_ESC}\.[0-9]+$" | sort -V | tail -n 1 || true)
          if [ -n "$LAST" ]; then N=$(( ${LAST##*.} + 1 )); else N=1; fi
          SUFFIXED="${IMAGE}:${BASE}.${N}"
          docker tag qwenproxy:candidate "$SUFFIXED"
          docker tag qwenproxy:candidate "${IMAGE}:${BASE}"
          docker push "$SUFFIXED"
          docker push "${IMAGE}:${BASE}"
          {
            echo "### qwenproxy image pushed"
            echo ""
            echo "- new immutable tag: \`${BASE}.${N}\`"
            echo "- compose tag \`${BASE}\` updated to the same image"
            echo "- fingerprint: \`${NEW_FP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pushed ${SUFFIXED}; ${IMAGE}:${BASE} now points to it"

      - name: Report skip
        if: env.UNCHANGED == 'true'
        run: |
          {
            echo "### qwenproxy image unchanged"
            echo ""
            echo "- built image is content-identical to \`${IMAGE}:${BASE}\`"
            echo "- no push, suffix not incremented"
          } >> "$GITHUB_STEP_SUMMARY"
