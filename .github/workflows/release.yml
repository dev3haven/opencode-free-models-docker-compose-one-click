name: Build qwenproxy image

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "johngbl/qwenproxy ref (tag or branch); empty = latest release"
        required: false
        default: ""
      force:
        description: "Build a new tagged version even if the image is unchanged"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-qwenproxy
  cancel-in-progress: false

env:
  UPSTREAM: johngbl/qwenproxy
  IMAGE: qwenproxy

jobs:
  resolve:
    name: Resolve upstream ref and next tag
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.next.outputs.tag }}
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
      skip: ${{ steps.next.outputs.skip }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Lowercase owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$MANUAL_REF" ]; then
            echo "ref=$MANUAL_REF" >> "$GITHUB_OUTPUT"
            echo "Manual ref: $MANUAL_REF"
            exit 0
          fi
          REF="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          if [ -z "$REF" ]; then
            echo "No releases found in ${UPSTREAM}" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $REF"

      - name: Compute build fingerprint
        id: fp
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          UPSTREAM_SHA="$(gh api "repos/${UPSTREAM}/commits/${REF}" --jq .sha)"
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Failed to resolve commit for ${UPSTREAM} ${REF}" >&2
            exit 1
          fi
          DOCKERFILE_SHA="$(sha256sum docker/qwenproxy-slim/Dockerfile | cut -d' ' -f1)"
          FINGERPRINT="$(printf '%s %s' "$UPSTREAM_SHA" "$DOCKERFILE_SHA" | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next tag suffix
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_LC: ${{ steps.owner.outputs.owner_lc }}
          REF: ${{ steps.ref.outputs.ref }}
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
          FORCE: ${{ inputs.force }}
        run: |
          OWNER_TYPE="$(gh api "users/${OWNER}" --jq .type)"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${OWNER}/packages/container/${IMAGE}/versions"
          else
            API_PATH="/user/packages/container/${IMAGE}/versions"
          fi
          LAST_N="$(gh api --paginate "$API_PATH" \
            | jq -s --arg ref "$REF" '
                add
                | [ .[]
                    | (.metadata.container.tags // [])[]
                    | select(startswith($ref + "-"))
                    | select((ltrimstr($ref + "-")) | test("^[0-9]+$"))
                    | (ltrimstr($ref + "-") | tonumber)
                  ]
                | max // 0')"
          if [ "$LAST_N" -eq 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=${REF}-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE_REF="ghcr.io/${OWNER_LC}/${IMAGE}:${REF}-${LAST_N}"
          LAST_FP="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Image.Config.Labels}}' \
            | jq -r '."org.opencontainers.image.revision" // ""')"
          if [ "$FORCE" = "true" ] || [ "$LAST_FP" != "$FINGERPRINT" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=${REF}-$((LAST_N + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=${REF}-${LAST_N}" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE_REF} is identical to the current build - skipping"
          fi

  build:
    name: Build and push
    needs: resolve
    if: ${{ needs.resolve.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/qwenproxy-slim/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            UPSTREAM_REF=${{ needs.resolve.outputs.ref }}
          tags: |
            ghcr.io/${{ needs.resolve.outputs.owner_lc }}/${{ env.IMAGE }}:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.fingerprint }}
            org.opencontainers.image.description=Built from ${{ env.UPSTREAM }} ${{ needs.resolve.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
