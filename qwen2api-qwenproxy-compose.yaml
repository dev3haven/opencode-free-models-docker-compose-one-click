name: qwenproxy

x-qwen-accounts: &qwen_accounts |-
    example_1@example.com:MY_PASSWORD_1
    example_2@example.com:MY_PASSWORD_2
    example_3@example.com:MY_PASSWORD_3

services:
  qwenproxy-init:
    image: alpine:3.24
    restart: "no"
    volumes:
      - ./data:/out
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ -f /out/qwenproxy.env ]; then
          API_KEY=$$(sed -n 's/^API_KEY=//p' /out/qwenproxy.env)
        else
          API_KEY="sk-$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        fi
        if [ -z "$$API_KEY" ]; then
          echo "init: api key is empty - fix or delete data/qwenproxy.env" >&2
          exit 1
        fi
        printf 'API_KEY=%s\n' "$$API_KEY" > /out/qwenproxy.env
        printf '%s' "$$API_KEY" > /out/qwenproxy.key
        cat > /out/CREDENTIALS.txt <<EOF
        qwenproxy one-click (johngbl/qwenproxy)
        API key (server auth; opencode and other clients): $$API_KEY
        Chat API: http://localhost:38090/v1
        Anthropic API (Claude Code): http://localhost:38090/v1/messages
        curl http://localhost:38090/v1/models -H "Authorization: Bearer $$API_KEY"
        Accounts: list them in x-qwen-accounts at the top of compose.yaml
        Account format: email:password - no per-account proxy, no token support
        Claude Code: qpx sync claude on the host, or export ANTHROPIC_BASE_URL=http://localhost:38090 with the API key above
        opencode: put opencode.jsonc and qwenproxy.key from data/ next to your opencode config
        EOF
        chmod 600 /out/qwenproxy.env /out/CREDENTIALS.txt
        chmod 644 /out/qwenproxy.key
        echo "init: key ready (data/qwenproxy.env, data/CREDENTIALS.txt)"

  qwenproxy:
    image: ghcr.io/dev3haven/qwenproxy:v1.6.11.1
    restart: always
    depends_on:
      qwenproxy-init:
        condition: service_completed_successfully
        restart: true
    shm_size: "2gb"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ ! -s /app/data/qwenproxy.env ]; then
          echo "qwenproxy: data/qwenproxy.env not found - qwenproxy-init must run first" >&2
          exit 1
        fi
        set -a
        . /app/data/qwenproxy.env
        set +a
        if [ -z "$${API_KEY:-}" ]; then
          echo "qwenproxy: API_KEY is empty in data/qwenproxy.env" >&2
          exit 1
        fi
        exec /usr/bin/dumb-init -- /app/docker-entrypoint.sh npx tsx src/index.ts
    ports:
      - "38090:7936"
    volumes:
      - ./data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "7936"
      PLAYWRIGHT_HEADLESS: "true"
      QWEN_ACCOUNTS: *qwen_accounts
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7936/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qwenproxy-models:
    image: alpine:3.24
    restart: "no"
    depends_on:
      qwenproxy:
        condition: service_started
    volumes:
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        KEY=$$(cat /seed/qwenproxy.key)
        BASE=http://qwenproxy:7936
        CATALOG_READY=0
        TRIES=0
        while [ "$$TRIES" -lt 36 ]; do
          if curl -fsS "$$BASE/v1/models" -H "Authorization: Bearer $$KEY" > /tmp/models_raw.json 2>/dev/null \
             && curl -fsS "$$BASE/v1/models" -H "Authorization: Bearer $$KEY" -H "anthropic-version: 2023-06-01" > /tmp/models.json 2>/dev/null; then
            COUNT=$$(jq -r '.data | length' /tmp/models.json 2>/dev/null || echo 0)
            if [ "$${COUNT:-0}" -gt 0 ]; then
              CATALOG_READY=1
              break
            fi
          fi
          TRIES=$$((TRIES + 1))
          sleep 5
        done
        if [ "$$CATALOG_READY" -ne 1 ]; then
          echo "models: catalog is empty (no working accounts yet) - add accounts in x-qwen-accounts, then re-run: docker compose run --rm qwenproxy-models" >&2
          exit 1
        fi
        jq -e '(.data | type) == "array"' /tmp/models_raw.json >/dev/null || {
          echo "models: bad catalog in /tmp/models_raw.json" >&2
          exit 1
        }
        LIVE_COUNT=$$(jq '[.data[] | select((keys - ["id","object","created","owned_by","media_generation","media_modes","media_reference_required"]) | length > 0)] | length' /tmp/models_raw.json)
        if [ "$${LIVE_COUNT:-0}" -eq 0 ]; then
          echo "models: server returned the upstream FALLBACK model list (live account catalog unavailable - browser/WAF not ready). Nothing written. Re-run later: docker compose run --rm qwenproxy-models" >&2
          exit 1
        fi
        jq -n --slurpfile raw /tmp/models_raw.json --slurpfile ant /tmp/models.json '
          ([ $$raw[0].data[] | select((keys - ["id","object","created","owned_by","media_generation","media_modes","media_reference_required"]) | length > 0) | .id ]) as $$live
          | {
              "$$schema": "https://opencode.ai/config.json",
              providers: {
                "qwenproxy": {
                  name: "qwenproxy",
                  package: "@opencode/ai/providers/openai-compatible",
                  settings: {
                    baseURL: "http://localhost:38090/v1",
                    apiKey: "{file:qwenproxy.key}"
                  },
                  models: ([ $$ant[0].data[]
                    | select(.id as $$id | $$live | index($$id))
                    | {
                        key: .id,
                        value: {
                          name: (.display_name // .id),
                          type: (if (.id | test("image|video|-(t2v|i2v)$")) then "image" else "chat" end),
                          capabilities: {
                            tools: (if (.id | test("image|video|-(t2v|i2v)$")) then false else true end),
                            input: (["text"]
                              + (if (.capabilities.image_input.supported // false) then ["image"] else [] end)
                              + (if (.capabilities.pdf_input.supported // false) then ["pdf"] else [] end)
                              + (if (.capabilities.audio_input.supported // false) then ["audio"] else [] end)
                              + (if (.capabilities.video_input.supported // false) then ["video"] else [] end)),
                            output: (if (.id | test("image")) then ["image"]
                              elif (.id | test("video|-(t2v|i2v)$")) then ["video"]
                              else ["text"] end),
                            reasoning: (if (.capabilities.thinking.supported // false)
                              then {supported: true, effort: ["low", "medium", "high"]}
                              else {supported: false}
                            end)
                          },
                          limit: {
                            context: .max_input_tokens,
                            output: .max_tokens
                          }
                        }
                      }] | from_entries)
                }
              }
            }' > /tmp/opencode.jsonc
        jq -e . /tmp/opencode.jsonc >/dev/null || {
          echo "models: invalid JSON in /tmp/opencode.jsonc" >&2
          exit 1
        }
        cp /tmp/opencode.jsonc /seed/opencode.jsonc
        cp /tmp/models_raw.json /seed/models.json
        echo "models: live catalog ($$LIVE_COUNT models):"
        jq -r '[.data[] | select((keys - ["id","object","created","owned_by","media_generation","media_modes","media_reference_required"]) | length > 0) | .id] | .[]' /tmp/models_raw.json | sed 's/^/  - /'
        echo "models: wrote data/opencode.jsonc ($$(wc -c < /seed/opencode.jsonc) bytes) and raw catalog data/models.json"
        echo "models: re-run after changing accounts or upstream models: docker compose run --rm qwenproxy-models"

  qwenproxy-reset:
    image: docker:29.9.2-cli-alpine3.24
    restart: "no"
    profiles:
      - reset
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        PROJECT=$${COMPOSE_PROJECT_NAME:-qwenproxy}
        SELF=$$(hostname)
        docker ps -a --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.ID}} {{.Names}}' | grep -v "^$$SELF" | cut -d' ' -f2- | xargs -r docker rm -f || true
        docker volume ls -q --filter "label=com.docker.compose.project=$$PROJECT" | xargs -r docker volume rm || true
        docker network ls --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.Name}}' | xargs -r docker network rm || true
        rm -rf /seed/* /seed/.[!.]* /seed/..?* || true

networks:
  default:
    name: qwenproxy
