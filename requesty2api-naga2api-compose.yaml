name: llmkeyproxy

# =============================================================================
# llmkeyproxy - one-click LLM proxy for opencode / Claude Code
#
# WHERE TO GET KEYS:
#   Requesty: sign up at https://app.requesty.ai, open the "API Keys" page and
#             create a key (looks like sk-...). Free models need no credit card.
#   NagaAI:   sign up at https://naga.ac, open "API Keys" in the dashboard and
#             click "Create API Key" (looks like ng-...). Copy it at once -
#             the site shows it only once.
#
#   Site logins/passwords are ONLY for logging into these sites. The proxy
#   accepts API keys (Bearer tokens) and nothing else for these providers -
#   never put a login or password anywhere in this file. (OAuth login is
#   supported by the proxy only for the Gemini CLI provider.)
#
# HOW TO ENTER THEM:
#   1. Replace the PUT-YOUR-...-KEY-N-HERE values below with your real keys
#      (keep the double quotes around the value).
#   2. Add more keys by adding lines: REQUESTY_API_KEY_3="...", _4, _5 ...
#      and/or NAGA_API_KEY_3="..." - any count, any numbering, gaps are fine
#      (e.g. only _1 and _5). Keys are rotated automatically.
#   3. Remove keys by deleting their lines. A provider with no keys left is
#      simply skipped everywhere (no hard errors).
#   4. Do not touch REQUESTY_API_BASE / NAGA_API_BASE lines.
#   Note: free-tier limits are per organisation (Requesty) / per account
#   (NagaAI) - all keys of one account share its daily pool.
#
#   After editing keys:            docker compose up -d
#   Regenerate the model catalog:  docker compose run --rm llmkeyproxy-models
#   Full reset (wipes data/):      docker compose --profile reset run --rm llmkeyproxy-reset
# =============================================================================
x-provider-env: &provider_env |-
  # Requesty (https://requesty.ai) - free tier: 20 requests/min and 200/day per organisation, shared across all free models
  # Get keys: https://app.requesty.ai -> "API Keys" page (sk-...)
  REQUESTY_API_KEY_1="PUT-YOUR-REQUESTY-KEY-1-HERE"
  REQUESTY_API_KEY_2="PUT-YOUR-REQUESTY-KEY-2-HERE"
  REQUESTY_API_BASE="https://router.requesty.ai/v1"
  ROTATION_MODE_REQUESTY=balanced
  OPTIMAL_CONCURRENT_REQUESTS_PER_KEY_REQUESTY=1

  # NagaAI (https://naga.ac) - free tier: 10 requests/min and 100/day per account, shared across all free models
  # Get keys: https://naga.ac dashboard -> "API Keys" -> Create API Key (ng-...)
  NAGA_API_KEY_1="PUT-YOUR-NAGAAI-KEY-1-HERE"
  NAGA_API_KEY_2="PUT-YOUR-NAGAAI-KEY-2-HERE"
  NAGA_API_BASE="https://api.naga.ac/v1"
  ROTATION_MODE_NAGA=balanced
  OPTIMAL_CONCURRENT_REQUESTS_PER_KEY_NAGA=1

  TIMEOUT_READ_STREAMING=300
  TIMEOUT_READ_NON_STREAMING=900

services:
  llmkeyproxy-init:
    image: alpine:3.24
    restart: "no"
    volumes:
      - ./data:/out
    environment:
      LLM_PROVIDER_ENV: *provider_env
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /out/usage /out/logs /out/oauth_creds
        if [ -f /out/llmkeyproxy.env ]; then
          API_KEY=$$(sed -n 's/^PROXY_API_KEY=//p' /out/llmkeyproxy.env | tr -d '"')
        else
          API_KEY="sk-$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        fi
        if [ -z "$$API_KEY" ]; then
          echo "init: api key is empty - fix or delete data/llmkeyproxy.env" >&2
          exit 1
        fi
        RQ_KEYS=$$(printf '%s\n' "$${LLM_PROVIDER_ENV:-}" | grep -c '^REQUESTY_API_KEY' || true)
        NG_KEYS=$$(printf '%s\n' "$${LLM_PROVIDER_ENV:-}" | grep -c '^NAGA_API_KEY' || true)
        {
          printf 'PROXY_API_KEY="%s"\n' "$$API_KEY"
          printf '%s\n' "$${LLM_PROVIDER_ENV:-}"
        } > /out/llmkeyproxy.env
        printf '%s' "$$API_KEY" > /out/llmkeyproxy.key
        cat > /out/CREDENTIALS.txt <<EOF
        llmkeyproxy one-click (ghcr.io/mirrowel/llm-api-key-proxy:20260527-172356-af40b91)
        API key (server auth; opencode and other clients): $$API_KEY
        Chat API: http://localhost:38084/v1
        Anthropic API (Claude Code): http://localhost:38084/v1/messages
        Model format: provider/model, e.g. requesty/nvidia/nemotron-3-ultra-550b-a55b or naga/nemotron-3-ultra-550b-a55b:free
        Full free model list: data/opencode.jsonc (generated by: docker compose run --rm llmkeyproxy-models)
        curl http://localhost:38084/v1/chat/completions -H "Authorization: Bearer $$API_KEY" -H "Content-Type: application/json" -d '{"model":"requesty/nvidia/nemotron-3-ultra-550b-a55b","messages":[{"role":"user","content":"hi"}]}'
        Provider keys: list them in x-provider-env at the top of compose.yaml - found now: $$RQ_KEYS requesty key(s), $$NG_KEYS nagaai key(s)
        Get keys: requesty - https://app.requesty.ai ("API Keys" page, sk-...); nagaai - https://naga.ac dashboard ("API Keys", ng-...)
        Site logins/passwords are never used here - the proxy takes API keys only; add or remove numbered keys (_1, _2, _3 ... any count) freely to scale free-tier limits
        Claude Code: export ANTHROPIC_BASE_URL=http://localhost:38084 and ANTHROPIC_AUTH_TOKEN with the API key above
        opencode: put opencode.jsonc and llmkeyproxy.key from data/ next to your opencode config
        EOF
        chmod 600 /out/llmkeyproxy.env /out/CREDENTIALS.txt
        chmod 644 /out/llmkeyproxy.key
        echo "init: key ready (data/llmkeyproxy.env, data/CREDENTIALS.txt)"

  llmkeyproxy:
    image: ghcr.io/mirrowel/llm-api-key-proxy:20260527-172356-af40b91
    restart: unless-stopped
    depends_on:
      llmkeyproxy-init:
        condition: service_completed_successfully
        restart: true
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        if [ ! -s /app/data/llmkeyproxy.env ]; then
          echo "llmkeyproxy: data/llmkeyproxy.env not found - llmkeyproxy-init must run first" >&2
          exit 1
        fi
        cp /app/data/llmkeyproxy.env /app/.env
        chmod 600 /app/.env
        exec python src/proxy_app/main.py --port 8000
    ports:
      - "38084:8000"
    volumes:
      - ./data:/app/data
      - ./data/logs:/app/logs
      - ./data/usage:/app/usage
      - ./data/oauth_creds:/app/oauth_creds
    environment:
      SKIP_OAUTH_INIT_CHECK: "true"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u;k=[l.split('=',1)[1].strip().strip(chr(34)) for l in open('/app/.env') if l.startswith('PROXY_API_KEY=')][0];r=u.urlopen(u.Request('http://127.0.0.1:8000/',headers={'Authorization':'Bearer '+k}),timeout=5);exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  llmkeyproxy-models:
    image: alpine:3.24
    restart: "no"
    depends_on:
      llmkeyproxy:
        condition: service_started
    volumes:
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        set -a
        . /seed/llmkeyproxy.env
        set +a

        key_vars() {
          # names of <PREFIX>_API_KEY and <PREFIX>_API_KEY_<n> variables, ordered by number
          env | sed -nE "s/^($$1_API_KEY(_[0-9]+)?)=.*/\1/p" | sort -t_ -k4,4n
        }

        try_fetch() {
          # $$1 = api base, $$2 = output file, $$3... = key variable names to try in order
          BASE="$$1"; OUT="$$2"; shift 2
          for VAR in "$$@"; do
            KEY=$$(printenv "$$VAR" || true)
            if curl -fsS --retry 3 --retry-delay 2 \
                 "$${BASE%/}/models" -H "Authorization: Bearer $$KEY" > "$$OUT"; then
              if jq -e '(.data | type) == "array"' "$$OUT" >/dev/null; then
                echo "models: fetched via $$VAR"
                return 0
              fi
              echo "models: $$VAR returned an invalid /models payload - trying next key" >&2
            else
              echo "models: $$VAR fetch failed - trying next key" >&2
            fi
          done
          return 1
        }

        RQ_BASE=$$(printenv REQUESTY_API_BASE || true)
        NG_BASE=$$(printenv NAGA_API_BASE || true)
        RQ_VARS=$$(key_vars REQUESTY)
        NG_VARS=$$(key_vars NAGA)

        RQ_OK=false
        if [ -z "$$RQ_BASE" ] || [ -z "$$RQ_VARS" ]; then
          echo "models: requesty not configured (need REQUESTY_API_BASE and at least one REQUESTY_API_KEY<n> in x-provider-env) - skipping provider" >&2
        elif ! try_fetch "$$RQ_BASE" /tmp/requesty.json $$RQ_VARS; then
          echo "models: requesty: all keys failed - check REQUESTY_API_KEY<n> entries in x-provider-env - skipping provider" >&2
        else
          RQ_OK=true
        fi
        $$RQ_OK || rm -f /seed/models-requesty.json
        $$RQ_OK || printf '{"data":[]}\n' > /tmp/requesty.json

        NG_OK=false
        if [ -z "$$NG_BASE" ] || [ -z "$$NG_VARS" ]; then
          echo "models: nagaai not configured (need NAGA_API_BASE and at least one NAGA_API_KEY<n> in x-provider-env) - skipping provider" >&2
        elif ! try_fetch "$$NG_BASE" /tmp/naga.json $$NG_VARS; then
          echo "models: nagaai: all keys failed - check NAGA_API_KEY<n> entries in x-provider-env - skipping provider" >&2
        else
          NG_OK=true
        fi
        $$NG_OK || rm -f /seed/models-naga.json
        $$NG_OK || printf '{"data":[]}\n' > /tmp/naga.json

        if ! $$RQ_OK && ! $$NG_OK; then
          echo "models: no provider catalog fetched - check keys in x-provider-env, then re-run: docker compose run --rm llmkeyproxy-models" >&2
          exit 1
        fi

        jq -n --slurpfile rq /tmp/requesty.json --slurpfile ng /tmp/naga.json '
          ([ $$rq[0].data[]
             | select((.api // "chat") == "chat")
             | ([.pricing[]? | select(.prompt_tokens_threshold == 0)][0] // {}) as $$p
             | select(($$p.input_price // 1) == 0 and ($$p.output_price // 1) == 0)
             | { key: ("requesty/" + .id),
                 value: ({
                   name: .id,
                   capabilities: {
                     tools: (.supports_tool_calling // false),
                     input: (["text"] + (if (.supports_vision // false) then ["image"] else [] end)),
                     output: (if (.supports_image_generation // false) then ["image"] else ["text"] end),
                     reasoning: (if (.supports_reasoning // false)
                       then {supported: true} + (if (.id | test("nemotron")) then {effort: ["low", "medium", "high"]} else {} end)
                       else {supported: false} end)
                   }
                 } + (if ((.context_window // null) != null) or ((.max_output_tokens // null) != null)
                   then {limit: {context: (.context_window // null), output: (.max_output_tokens // null)}} else {} end)) }
           ]
           + [ $$ng[0].data[]
             | . as $$m
             | (([$$m.operations[]? | select(.operation == "chat")] | first) // {}) as $$op
             | ($$op.parameters["reasoning_effort"] // $$op.parameters["reasoning"] // null) as $$r
             | select((($$m.kinds // []) | index("chat")) != null)
             | select(($$m.id | endswith(":free"))
                 or (([$$m.pricing[]? | select(.meter == "input_token" or .meter == "output_token" or .meter == "token")] | length) > 0
                     and ([$$m.pricing[]? | select(.meter == "input_token" or .meter == "output_token" or .meter == "token")
                          | select(((.price // "1") | tonumber) != 0)] | length == 0)))
             | { key: ("naga/" + $$m.id),
                 value: ({
                   name: ($$m.display_name // $$m.id),
                   capabilities: {
                     tools: (($$op.parameters.tools["x-support"] // "none") != "none"),
                     input: ($$m.architecture.input_modalities // ["text"]),
                     output: ($$m.architecture.output_modalities // ["text"]),
                     reasoning: (if ($$r != null and (($$r["x-support"] // "native") != "none"))
                       then {supported: true} + (if ($$r.enum // null) != null then {effort: $$r.enum} else {} end)
                       else {supported: false} end)
                   }
                 } + (if (($$op.limits.context_window // null) != null)
                   then {limit: {context: $$op.limits.context_window}} else {} end)) }
           ])
          | {
              "$$schema": "https://opencode.ai/config.json",
              providers: {
                "llmkeyproxy": {
                  name: "llmkeyproxy",
                  package: "@opencode/ai/providers/openai-compatible",
                  settings: {
                    baseURL: "http://localhost:38084/v1",
                    apiKey: "{file:llmkeyproxy.key}"
                  },
                  models: (from_entries)
                }
              }
            }' > /tmp/opencode.jsonc
        jq -e . /tmp/opencode.jsonc >/dev/null || {
          echo "models: invalid JSON in /tmp/opencode.jsonc" >&2
          exit 1
        }
        TOTAL=$$(jq -r '.providers.llmkeyproxy.models | length' /tmp/opencode.jsonc)
        if [ "$${TOTAL:-0}" -eq 0 ]; then
          echo "models: no free models found - check REQUESTY/NAGA keys in x-provider-env, then re-run: docker compose run --rm llmkeyproxy-models" >&2
          exit 1
        fi
        RQ_COUNT=$$(jq -r '[.providers.llmkeyproxy.models | keys[] | select(startswith("requesty/"))] | length' /tmp/opencode.jsonc)
        NG_COUNT=$$(jq -r '[.providers.llmkeyproxy.models | keys[] | select(startswith("naga/"))] | length' /tmp/opencode.jsonc)
        cp /tmp/opencode.jsonc /seed/opencode.jsonc
        $$RQ_OK && cp /tmp/requesty.json /seed/models-requesty.json || true
        $$NG_OK && cp /tmp/naga.json /seed/models-naga.json || true
        if ! jq -e '[.providers.llmkeyproxy.models | keys[] | select(test("nemotron"))] | length > 0' /tmp/opencode.jsonc >/dev/null; then
          echo "models: warning - no nemotron models in catalog (upstream free line-up may have changed)" >&2
        fi
        echo "models: free catalog ($$TOTAL models: $$RQ_COUNT requesty, $$NG_COUNT nagaai):"
        jq -r '.providers.llmkeyproxy.models | keys[]' /tmp/opencode.jsonc | sed 's/^/  - /'
        echo "models: wrote data/opencode.jsonc ($$(wc -c < /seed/opencode.jsonc) bytes), raw catalogs data/models-requesty.json / data/models-naga.json (fetched providers only)"
        echo "models: re-run after changing keys or upstream models: docker compose run --rm llmkeyproxy-models"

  llmkeyproxy-reset:
    image: docker:29.9.2-cli-alpine3.24
    restart: "no"
    profiles:
      - reset
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        SELF=$$(hostname)
        PROJECT=$$(docker inspect "$$SELF" --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || true)
        [ -n "$$PROJECT" ] || PROJECT="$${COMPOSE_PROJECT_NAME:-llmkeyproxy}"
        docker ps -a --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.ID}} {{.Names}}' | grep -v "^$$SELF" | cut -d' ' -f2- | xargs -r docker rm -f || true
        docker volume ls -q --filter "label=com.docker.compose.project=$$PROJECT" | xargs -r docker volume rm || true
        docker network ls --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.Name}}' | xargs -r docker network rm || true
        rm -rf /seed/* /seed/.[!.]* /seed/..?* || true

networks:
  default:
    name: llmkeyproxy
