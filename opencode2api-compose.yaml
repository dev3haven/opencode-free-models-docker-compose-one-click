name: opencode2api

services:
  opencode2api-cloudflare-proxy-init:
    image: alpine:3.24
    restart: "no"
    volumes:
      - ./data:/seed
      - ./data/cloudflare-proxy:/out
      - opencode2api-cloudflare-proxy-state:/state
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        apk add --no-cache jq >/dev/null
        if [ -f /seed/config.json ] && [ ! -f /out/config.json ]; then
          cp /seed/config.json /out/config.json
          rm -f /seed/config.json
        fi
        if [ -f /out/config.json ]; then
          SERVER_KEY=$$(sed -n 's/.*"server_keys"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\([^"]*\)".*/\1/p' /out/config.json)
          WEBUI_PASS=$$(sed -n 's/.*"password"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /out/config.json)
        else
          SERVER_KEY=$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
          WEBUI_PASS=$$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          cat > /out/config.json <<EOF
        {
          "listen": "0.0.0.0:8080",
          "server_keys": ["$$SERVER_KEY"],
          "zen_keys": [],
          "go_keys": [],
          "anonymous": true,
          "warp": {
            "enabled": true,
            "pool_size": 8,
            "stack": "ipv6",
            "source_ipv6": ""
          },
          "proxies": ["direct"],
          "proxyfile": "",
          "upstream": {
            "zen": "https://opencode.ai/zen",
            "go": "https://opencode.ai/zen/go",
            "anonymous": "https://opencode.ai/inference"
          },
          "retry": { "max_attempts": 8, "timeout_seconds": 600 },
          "models": { "refresh_seconds": 300, "protocols": {}, "free_only": false },
          "performance": {
            "max_idle_conns": 2048,
            "max_idle_conns_per_host": 256,
            "max_conns_per_host": 0,
            "idle_conn_timeout_seconds": 120,
            "connect_timeout_seconds": 5,
            "failure_cooldown_seconds": 15,
            "attempt_timeout_seconds": 60,
            "first_event_timeout_seconds": 15,
            "max_anonymous_exits": 8,
            "free_tier_block_seconds": 900
          },
          "logging": { "level": "info", "ring_size": 2000, "dump_request_bodies": false },
          "webui": {
            "enabled": true,
            "listen": "0.0.0.0:8081",
            "username": "admin",
            "password": "$$WEBUI_PASS",
            "session_ttl_minutes": 720
          },
          "prefer": "go",
          "reasoning": { "effort": "high", "effort_by_model": {} },
          "rotation": {
            "sota": { "alias": "sota", "order": [] },
            "sweet": { "alias": "sweet", "order": [] },
            "first_output_seconds": 30
          }
        }
        EOF
        fi
        sync_gateway_knobs() {
          [ -f "$$1" ] || return 0
          sed -e 's/"max_attempts":[[:space:]]*[0-9][0-9]*/"max_attempts": 8/' \
              -e 's/"timeout_seconds":[[:space:]]*[0-9][0-9]*/"timeout_seconds": 600/' \
              -e 's/"pool_size":[[:space:]]*[0-9][0-9]*/"pool_size": 8/' \
              -e 's/"first_event_timeout_seconds":[[:space:]]*[0-9][0-9]*/"first_event_timeout_seconds": 15/' \
              -e 's/"attempt_timeout_seconds":[[:space:]]*[0-9][0-9]*/"attempt_timeout_seconds": 60/' \
              "$$1" > /tmp/config.sync && cat /tmp/config.sync > "$$1" && rm -f /tmp/config.sync
        }
        sync_gateway_knobs /out/config.json
        sync_gateway_knobs /state/config.json
        check_knob() {
          grep -Eq "\"$$2\"[[:space:]]*:[[:space:]]*$$3([,}[:space:]]|$$)" "$$1"
        }
        for f in /out/config.json /state/config.json; do
          [ -f "$$f" ] || continue
          check_knob "$$f" max_attempts 8 &&
          check_knob "$$f" timeout_seconds 600 &&
          check_knob "$$f" pool_size 8 &&
          check_knob "$$f" first_event_timeout_seconds 15 &&
          check_knob "$$f" attempt_timeout_seconds 60 || {
            echo "cloudflare-proxy-init: retry/timeout knobs not confirmed in $$f" >&2
            exit 1
          }
        done
        jq -e '.warp.enabled == true' /out/config.json >/dev/null || {
          echo "cloudflare-proxy-init: warp egress not confirmed in /out/config.json" >&2
          exit 1
        }
        if [ -z "$$SERVER_KEY" ] || [ -z "$$WEBUI_PASS" ]; then
          echo "cloudflare-proxy-init: empty key or password" >&2
          exit 1
        fi
        printf '%s' "$$SERVER_KEY" > /out/opencode2api-cloudflare-proxy.key
        rm -f /seed/connect.ps1 /seed/opencode2api.key /seed/CREDENTIALS.txt /out/opencode2api.key
        cat > /out/CREDENTIALS.txt <<EOF
        opencode2api-cloudflare-proxy (connections go through Cloudflare WARP)
        API key: $$SERVER_KEY
        API URL: http://localhost:38080
        WebUI URL: http://localhost:38081
        WebUI login: admin
        WebUI password: $$WEBUI_PASS
        curl.exe http://localhost:38080/v1/models -H "Authorization: Bearer $$SERVER_KEY"
        opencode: copy opencode.jsonc and opencode2api-cloudflare-proxy.key from data/cloudflare-proxy/ to the project root
        EOF
        chmod 600 /out/CREDENTIALS.txt
        chmod 644 /out/opencode2api-cloudflare-proxy.key

  opencode2api-cloudflare-proxy:
    image: ghcr.io/jasonxu114514/opencode2api:v1.4.6
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      opencode2api-cloudflare-proxy-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/config/config.json
      LISTEN_ADDRESS: ""
      WEBUI_LISTEN_ADDRESS: ""
    ports:
      - "38080:8080"
      - "38081:8081"
    volumes:
      - ./data/cloudflare-proxy:/run/config:ro
      - opencode2api-cloudflare-proxy-state:/var/lib/opencode2api
    tmpfs:
      - /tmp

  opencode2api-no-cloudflare-proxy-init:
    image: alpine:3.24
    restart: "no"
    volumes:
      - ./data/no-cloudflare-proxy:/out
      - opencode2api-no-cloudflare-proxy-state:/state
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        apk add --no-cache jq >/dev/null
        if [ -f /out/config.json ]; then
          SERVER_KEY=$$(sed -n 's/.*"server_keys"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\([^"]*\)".*/\1/p' /out/config.json)
          WEBUI_PASS=$$(sed -n 's/.*"password"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /out/config.json)
        else
          SERVER_KEY=$$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
          WEBUI_PASS=$$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          cat > /out/config.json <<EOF
        {
          "listen": "0.0.0.0:8080",
          "server_keys": ["$$SERVER_KEY"],
          "zen_keys": [],
          "go_keys": [],
          "anonymous": true,
          "warp": {
            "enabled": false,
            "pool_size": 8,
            "stack": "ipv6",
            "source_ipv6": ""
          },
          "proxies": ["direct"],
          "proxyfile": "",
          "upstream": {
            "zen": "https://opencode.ai/zen",
            "go": "https://opencode.ai/zen/go",
            "anonymous": "https://opencode.ai/inference"
          },
          "retry": { "max_attempts": 8, "timeout_seconds": 600 },
          "models": { "refresh_seconds": 300, "protocols": {}, "free_only": false },
          "performance": {
            "max_idle_conns": 2048,
            "max_idle_conns_per_host": 256,
            "max_conns_per_host": 0,
            "idle_conn_timeout_seconds": 120,
            "connect_timeout_seconds": 5,
            "failure_cooldown_seconds": 15,
            "attempt_timeout_seconds": 60,
            "first_event_timeout_seconds": 15,
            "max_anonymous_exits": 8,
            "free_tier_block_seconds": 900
          },
          "logging": { "level": "info", "ring_size": 2000, "dump_request_bodies": false },
          "webui": {
            "enabled": true,
            "listen": "0.0.0.0:8081",
            "username": "admin",
            "password": "$$WEBUI_PASS",
            "session_ttl_minutes": 720
          },
          "prefer": "go",
          "reasoning": { "effort": "high", "effort_by_model": {} },
          "rotation": {
            "sota": { "alias": "sota", "order": [] },
            "sweet": { "alias": "sweet", "order": [] },
            "first_output_seconds": 30
          }
        }
        EOF
        fi
        sync_gateway_knobs() {
          [ -f "$$1" ] || return 0
          sed -e 's/"max_attempts":[[:space:]]*[0-9][0-9]*/"max_attempts": 8/' \
              -e 's/"timeout_seconds":[[:space:]]*[0-9][0-9]*/"timeout_seconds": 600/' \
              -e 's/"pool_size":[[:space:]]*[0-9][0-9]*/"pool_size": 8/' \
              -e 's/"first_event_timeout_seconds":[[:space:]]*[0-9][0-9]*/"first_event_timeout_seconds": 15/' \
              -e 's/"attempt_timeout_seconds":[[:space:]]*[0-9][0-9]*/"attempt_timeout_seconds": 60/' \
              "$$1" > /tmp/config.sync && cat /tmp/config.sync > "$$1" && rm -f /tmp/config.sync
        }
        sync_gateway_knobs /out/config.json
        sync_gateway_knobs /state/config.json
        check_knob() {
          grep -Eq "\"$$2\"[[:space:]]*:[[:space:]]*$$3([,}[:space:]]|$$)" "$$1"
        }
        for f in /out/config.json /state/config.json; do
          [ -f "$$f" ] || continue
          check_knob "$$f" max_attempts 8 &&
          check_knob "$$f" timeout_seconds 600 &&
          check_knob "$$f" pool_size 8 &&
          check_knob "$$f" first_event_timeout_seconds 15 &&
          check_knob "$$f" attempt_timeout_seconds 60 || {
            echo "no-cloudflare-proxy-init: retry/timeout knobs not confirmed in $$f" >&2
            exit 1
          }
        done
        jq -e '(.warp.enabled == false) and (.proxies == ["direct"]) and (.proxyfile == "")' \
          /out/config.json >/dev/null || {
            echo "no-cloudflare-proxy-init: warp off / direct egress not confirmed in /out/config.json" >&2
            exit 1
          }
        if [ -z "$$SERVER_KEY" ] || [ -z "$$WEBUI_PASS" ]; then
          echo "no-cloudflare-proxy-init: empty key or password" >&2
          exit 1
        fi
        printf '%s' "$$SERVER_KEY" > /out/opencode2api-no-cloudflare-proxy.key
        rm -f /out/opencode2api.key
        cat > /out/CREDENTIALS.txt <<EOF
        opencode2api-no-cloudflare-proxy (no Cloudflare WARP, connections go directly from this machine)
        API key: $$SERVER_KEY
        API URL: http://localhost:38082
        WebUI URL: http://localhost:38083
        WebUI login: admin
        WebUI password: $$WEBUI_PASS
        curl.exe http://localhost:38082/v1/models -H "Authorization: Bearer $$SERVER_KEY"
        opencode: copy opencode.jsonc and opencode2api-no-cloudflare-proxy.key from data/no-cloudflare-proxy/ to the project root
        EOF
        chmod 600 /out/CREDENTIALS.txt
        chmod 644 /out/opencode2api-no-cloudflare-proxy.key

  opencode2api-no-cloudflare-proxy:
    image: ghcr.io/jasonxu114514/opencode2api:v1.4.6
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      opencode2api-no-cloudflare-proxy-init:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/config/config.json
      LISTEN_ADDRESS: ""
      WEBUI_LISTEN_ADDRESS: ""
    ports:
      - "38082:8080"
      - "38083:8081"
    volumes:
      - ./data/no-cloudflare-proxy:/run/config:ro
      - opencode2api-no-cloudflare-proxy-state:/var/lib/opencode2api
    tmpfs:
      - /tmp

  opencode2api-models:
    image: alpine:3.24
    restart: "no"
    depends_on:
      opencode2api-cloudflare-proxy:
        condition: service_started
    volumes:
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        KEY=$$(cat /seed/cloudflare-proxy/opencode2api-cloudflare-proxy.key)
        curl -fsS --retry 40 --retry-all-errors --retry-delay 5 \
          http://opencode2api-cloudflare-proxy:8080/healthz >/dev/null
        curl -fsS http://opencode2api-cloudflare-proxy:8080/v1/models \
          -H "Authorization: Bearer $$KEY" > /tmp/models.json
        jq -e '(.data | type) == "array"' /tmp/models.json >/dev/null || {
          echo "models: bad catalog in /tmp/models.json" >&2
          exit 1
        }
        mkdir -p /seed/cloudflare-proxy /seed/no-cloudflare-proxy
        rm -f /seed/opencode.jsonc
        jq --argjson model_efforts '{
            "beam-free": {"effort": ["low", "medium", "high", "xhigh", "max"]},
            "big-pickle": {},
            "deepseek-v4.1-flash-free": {"toggle": true, "effort": ["low", "high", "max"]},
            "flint-40b-free": {"effort": ["low", "medium", "high", "xhigh", "max"]},
            "glm-5.3-flash-free": {"effort": ["low", "high", "max"]},
            "mimo-v2.6-flash-free": {},
            "nemotron-3.5-lightning-free": {},
            "nemotron-3.5-super-vl-free": {"effort": ["none", "minimal", "low", "medium", "high", "xhigh"]},
            "pulse-alpha-free": {"effort": ["low", "high", "max"]}
          }' '{
            "$$schema": "https://opencode.ai/config.json",
            providers: {
              "opencode2api-cloudflare-proxy": {
                name: "opencode2api-cloudflare-proxy",
                package: "@opencode/ai/providers/openai-compatible",
                settings: {
                  baseURL: "http://localhost:38080/v1",
                  apiKey: "{file:opencode2api-cloudflare-proxy.key}"
                },
                models: (.data | map({
                  key: .id,
                  value: {
                    name: .id,
                    capabilities: {
                      reasoning: (if .reasoning then
                        {supported: true} +
                        (if ($$model_efforts[.id] // null) != null then $$model_efforts[.id]
                         elif (.reasoning_efforts | length) > 0 then {effort: .reasoning_efforts}
                         else {} end)
                      else {supported: false} end)
                    }
                  }
                }) | from_entries)
              }
            }
          }' /tmp/models.json > /tmp/cloudflare-proxy.jsonc
        jq --argjson model_efforts '{
            "beam-free": {"effort": ["low", "medium", "high", "xhigh", "max"]},
            "big-pickle": {},
            "deepseek-v4.1-flash-free": {"toggle": true, "effort": ["low", "high", "max"]},
            "flint-40b-free": {"effort": ["low", "medium", "high", "xhigh", "max"]},
            "glm-5.3-flash-free": {"effort": ["low", "high", "max"]},
            "mimo-v2.6-flash-free": {},
            "nemotron-3.5-lightning-free": {},
            "nemotron-3.5-super-vl-free": {"effort": ["none", "minimal", "low", "medium", "high", "xhigh"]},
            "pulse-alpha-free": {"effort": ["low", "high", "max"]}
          }' '{
            "$$schema": "https://opencode.ai/config.json",
            providers: {
              "opencode2api-no-cloudflare-proxy": {
                name: "opencode2api-no-cloudflare-proxy",
                package: "@opencode/ai/providers/openai-compatible",
                settings: {
                  baseURL: "http://localhost:38082/v1",
                  apiKey: "{file:opencode2api-no-cloudflare-proxy.key}"
                },
                models: (.data | map({
                  key: .id,
                  value: {
                    name: .id,
                    capabilities: {
                      reasoning: (if .reasoning then
                        {supported: true} +
                        (if ($$model_efforts[.id] // null) != null then $$model_efforts[.id]
                         elif (.reasoning_efforts | length) > 0 then {effort: .reasoning_efforts}
                         else {} end)
                      else {supported: false} end)
                    }
                  }
                }) | from_entries)
              }
            }
          }' /tmp/models.json > /tmp/no-cloudflare-proxy.jsonc
        for f in /tmp/cloudflare-proxy.jsonc /tmp/no-cloudflare-proxy.jsonc; do
          [ -s "$$f" ] || { echo "models: empty $$f" >&2; exit 1; }
          jq -e . "$$f" >/dev/null || { echo "models: invalid JSON in $$f" >&2; exit 1; }
        done
        cp /tmp/cloudflare-proxy.jsonc /seed/cloudflare-proxy/opencode.jsonc
        cp /tmp/no-cloudflare-proxy.jsonc /seed/no-cloudflare-proxy/opencode.jsonc
        echo "models: wrote data/cloudflare-proxy/opencode.jsonc ($$(wc -c < /seed/cloudflare-proxy/opencode.jsonc) bytes)"
        echo "models: wrote data/no-cloudflare-proxy/opencode.jsonc ($$(wc -c < /seed/no-cloudflare-proxy/opencode.jsonc) bytes)"

  opencode2api-reset:
    image: docker:29.9.2-cli-alpine3.24
    restart: "no"
    profiles:
      - reset
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/seed
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        PROJECT=${COMPOSE_PROJECT_NAME:-opencode2api}
        SELF=$$(hostname)
        docker ps -a --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.ID}} {{.Names}}' | grep -v "^$$SELF" | cut -d' ' -f2- | xargs -r docker rm -f || true
        docker volume ls -q --filter "label=com.docker.compose.project=$$PROJECT" | xargs -r docker volume rm || true
        docker network ls --filter "label=com.docker.compose.project=$$PROJECT" --format '{{.Name}}' | xargs -r docker network rm || true
        rm -rf /seed/* /seed/.[!.]* /seed/..?* || true

volumes:
  opencode2api-cloudflare-proxy-state:
  opencode2api-no-cloudflare-proxy-state:

networks:
  default:
    name: opencode2api
